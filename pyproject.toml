[project]
name = "widescrape"
version = "0.2.0"
description = "Ambitious multi-source web scout & context-funnel (CLI + MCP + SKILL.md) for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ddgs>=8.0.0",
    "httpx>=0.28.0",
    "mcp>=1.2.0",
    "openpyxl>=3.1.5",
    "playwright>=1.49.0",
    "primp>=0.14.0",
    "pypdf>=5.1.0",
    "rank-bm25>=0.2.2",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
widescrape = "widescrape.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/widescrape"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "widescrape/skill_data/SKILL.md"
"references" = "widescrape/skill_data/references"
